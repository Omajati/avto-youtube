<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<script type="importmap">{"imports":{"three":"../lib/three.module.js"}}</script>
</head><body>
<div id="vig"></div>
<div id="labels"></div>
<div id="tag"></div>
<div id="title"></div>
<script src="globe_common.js"></script>
<script type="module">
// A 3D Earth: the camera flies from afar to the places of the story, the countries light up, points pulse,
// arcs join the stops of a route, labels and the plate appear. Each frame is drawn on demand (renderFrame(f)),
// so the motion is exactly smooth whatever the speed of the machine.
import * as THREE from "three";
import { LineSegments2 } from "../lib/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "../lib/lines/LineSegmentsGeometry.js";
import { Line2 } from "../lib/lines/Line2.js";
import { LineGeometry } from "../lib/lines/LineGeometry.js";
import { LineMaterial } from "../lib/lines/LineMaterial.js";

const S = window.SPEC, G = window.GLOBE;
const W = S.w || 1920, H = S.h || 1080, N = Math.max(2, S.frames || 240);
const plan = G.plan(S, N);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.01, 100);
scene.add(camera);
const load = u => new Promise((ok, bad) => new THREE.TextureLoader().load(u, ok, undefined, bad));

const D = Math.PI / 180;
function xyz(lat, lon, r = 1) {  // the same mapping as three.js SphereGeometry's texture
  const th = (90 - lat) * D, ph = (lon + 180) * D;
  return new THREE.Vector3(-Math.cos(ph) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(ph) * Math.sin(th) * r);
}

const [day, bump, water, geo] = await Promise.all([load("../img/earth-blue-marble.jpg"), load("../img/earth-topology.png"),
  load("../img/earth-water.png"), fetch("../geo/countries.json").then(r => r.json())]);
day.colorSpace = THREE.SRGBColorSpace; day.anisotropy = 8;

// stars: drawn once on a canvas (no big picture file)
{ const c = document.createElement("canvas"); c.width = 2048; c.height = 1024; const x = c.getContext("2d");
  x.fillStyle = "#02040a"; x.fillRect(0, 0, 2048, 1024);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2600; i++) { const a = rnd() ** 3 * .9 + .05; x.fillStyle = `rgba(220,230,255,${a})`;
    x.fillRect(rnd() * 2048, rnd() * 1024, rnd() < .04 ? 2 : 1, rnd() < .04 ? 2 : 1); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = t; }

const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 120), new THREE.MeshPhongMaterial({
  map: day, bumpMap: bump, bumpScale: 0.012, specularMap: water, specular: new THREE.Color(0x335577), shininess: 18 }));
scene.add(earth);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.06, 96, 64), new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vN; void main(){ float i = pow(0.68 - dot(vN, vec3(0.0,0.0,1.0)), 3.2); gl_FragColor = vec4(0.32,0.62,1.0,1.0) * i * 1.6; }` })));
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
camera.add(sun); sun.position.set(-1.3, 1.1, 2.2); sun.target.position.set(0, 0, -3); camera.add(sun.target);

// borders and coasts of all countries; the chosen ones get a gold outline and a soft fill
const res = new THREE.Vector2(W, H);
function segs(rings, r) {
  const pos = [];
  for (const ring of rings) for (let i = 1; i < ring.length; i++) {
    const a = xyz(ring[i - 1][1], ring[i - 1][0], r), b = xyz(ring[i][1], ring[i][0], r);
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
  return pos;
}
const lit = new Set(S.countries || []);
// all borders and coasts: plain thin lines (cheap to draw, also without a graphics card); fat lines only for the chosen
const borderMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, depthWrite: false });
{ const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(segs(geo.flatMap(c => c.r), 1.0015), 3));
  scene.add(new THREE.LineSegments(g, borderMat)); }
const chosen = geo.filter(c => lit.has(c.a3));
const litMat = new LineMaterial({ color: 0xffc861, linewidth: 3.2, transparent: true, opacity: 0, resolution: res });
if (chosen.length) scene.add(new LineSegments2(new LineSegmentsGeometry().setPositions(segs(chosen.flatMap(c => c.r), 1.002)), litMat));
let fillMat = null;
if (chosen.length) {  // the fill: an equirectangular canvas laid over the Earth
  const c = document.createElement("canvas"); c.width = 4096; c.height = 2048; const x = c.getContext("2d");
  x.fillStyle = "rgba(255,200,97,1)";
  for (const k of chosen) for (const ring of k.r) {
    let prev = null; const pts = ring.map(([lo, la]) => { if (prev !== null) { while (lo - prev > 180) lo -= 360; while (prev - lo > 180) lo += 360; } prev = lo; return [lo, la]; });
    for (const shift of [-360, 0, 360]) { x.beginPath(); pts.forEach(([lo, la], i) => { const px = (lo + shift + 180) / 360 * 4096, py = (90 - la) / 180 * 2048; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); x.fill(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  fillMat = new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0, depthWrite: false });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.0012, 160, 120), fillMat));
}

// places: a dot with pulsing rings each
const markers = plan.places.map(p => {
  const g = new THREE.Group(), at = xyz(p.lat, p.lon, 1.003);
  g.position.copy(at); g.lookAt(at.clone().multiplyScalar(2));
  const mat = c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.0085 * plan.scale, 32), mat(0xffffff));
  const core = new THREE.Mesh(new THREE.RingGeometry(0.0085 * plan.scale, 0.013 * plan.scale, 48), mat(0xffc861));
  const rings = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64), mat(0xffc861)); g.add(m); return m; });
  g.add(dot, core); scene.add(g);
  return { p, set(f) {
    const a = G.ease(G.seg(f, p.at, p.at + 12));
    dot.material.opacity = a; core.material.opacity = a;
    rings.forEach((m, i) => { const t = ((f - p.at) / 54 + i / 3) % 1;
      m.scale.setScalar((0.01 + 0.045 * t) * plan.scale); m.material.opacity = f >= p.at + i * 18 ? 0.85 * (1 - t) * a : 0; });
  } };
});

// the route: arcs lifted above the surface, drawn one after another
const arcs = plan.legs.map(leg => {
  const A = xyz(leg.a.lat, leg.a.lon), B = xyz(leg.b.lat, leg.b.lon), steps = 120, pts = [];
  const lift = Math.min(0.35, 0.04 + A.angleTo(B) * 0.35);
  for (let i = 0; i <= steps; i++) {
    const s = i / steps, v = new THREE.Vector3().copy(A).lerp(B, s).normalize();
    v.multiplyScalar(1.003 + lift * Math.sin(Math.PI * s)); pts.push(v.x, v.y, v.z);
  }
  const geom = new LineGeometry(); geom.setPositions(pts);
  // a light core over a wide gold glow: the route reads over the sea and over a gold country alike
  const glowLine = new Line2(geom, new LineMaterial({ color: 0xffb340, linewidth: 11, transparent: true, opacity: 0.45, resolution: res, depthWrite: false }));
  const line = new Line2(geom, new LineMaterial({ color: 0xfff6e0, linewidth: 4.5, transparent: true, opacity: 1, resolution: res }));
  line.computeLineDistances(); glowLine.computeLineDistances(); scene.add(glowLine); scene.add(line);
  line.userData.glow = glowLine;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.008 * plan.scale, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  scene.add(head);
  return { leg, pts, steps, line, head };
});

function setCamera(f) {
  const v = plan.camera(f);
  camera.position.copy(xyz(v.lat, v.lon, v.dist)); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();
}
function project(p) {
  const at = xyz(p.lat, p.lon, 1.01), v = at.clone().project(camera);
  const facing = at.clone().normalize().dot(camera.position.clone().normalize()) > 0.2;
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, facing };
}
// labels are laid out once (after the fonts, so their sizes are right), where the camera ends: they never jump
await G.ready();
setCamera(N - 1);
const labels = G.labels(plan.places.map(p => ({ ...p, ...project(p) })), W, H);
setCamera(0);

window.renderFrame = f => {
  setCamera(f);
  const hl = G.ease(G.seg(f, plan.lightAt, plan.lightAt + N * 0.12));
  litMat.opacity = 0.95 * hl; if (fillMat) fillMat.opacity = 0.32 * hl;
  borderMat.opacity = 0.3 - 0.1 * hl * (chosen.length ? 1 : 0);
  markers.forEach(m => m.set(f));
  arcs.forEach(a => {
    const k = G.ease2(G.seg(f, a.leg.from, a.leg.to));
    a.line.geometry.instanceCount = Math.max(1, Math.round(a.steps * k)); a.line.visible = k > 0; a.line.userData.glow.visible = k > 0;
    const i = Math.min(Math.round(a.steps * k), a.steps) * 3; a.head.position.set(a.pts[i], a.pts[i + 1], a.pts[i + 2]);
    a.head.visible = k > 0 && k < 1;
  });
  renderer.render(scene, camera);
  G.drawLabels(labels, f, p => project(p));
  G.drawPlates(S, plan, f);
};
window.renderFrame(0);
window.READY = true;
</script></body></html>
